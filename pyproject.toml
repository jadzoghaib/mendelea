[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mendelea"
version = "0.1.0"
description = "An evidence timeline for reported genetic variants"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mendelea = "mendelea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mendelea = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Offline by default. The live tests reach NCBI, take half a minute and fail
# when the endpoint is down, none of which should happen to someone who just
# typed `pytest`. Ask for them explicitly with `pytest -m network`, which
# overrides this.
addopts = "-q -m 'not network'"
markers = [
    "network: hits the live NCBI endpoint; run with -m network",
]
