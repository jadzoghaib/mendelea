# Fly.io deployment for the public evidence demo.
#
#   mendelea export-public --out mendelea-public.duckdb
#   fly launch --no-deploy --copy-config      # first time only
#   fly deploy
#
# Madrid because the audience is European laboratories and the round trip
# matters more than anything else about the placement. There is no volume and
# no secret: the container is stateless and the data it serves is public
# ClinVar, so losing the machine loses nothing but uptime.

app = "mendelea"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly terminates TLS and proxies, so every request arrives from the same
  # edge address. Without naming the header the limiter would throttle every
  # visitor as one client; trusting it anywhere else would let a caller mint
  # a fresh quota per request by setting it themselves.
  MENDELEA_TRUSTED_IP_HEADER = "Fly-Client-IP"
  MENDELEA_RATE_PER_MINUTE = "120"
  MENDELEA_RATE_BURST = "40"

  # Set explicitly because the defaults are sized for a machine DuckDB has to
  # itself. It reads the cgroup limit, claims 80% of it, and starts one worker
  # per visible CPU -- on this VM that was 409 MB of the 512 and 16 workers on
  # one shared core, which OOMKilled the container under 120 concurrent
  # visitors. Measured after capping: 150 concurrent all served, 198 MB peak.
  #
  # Raising the memory buys nothing, and that is measured: 192MB -> 409MB moved
  # the median under 60 concurrent by 0.4%, because the heaviest query peaks at
  # 34 MB and never wants more. CPU is the lever -- the same load runs 10s on
  # one vCPU and 6.5s on two, and stops improving past two because the
  # concurrency bound becomes the limit. Upgrade to shared-cpu-2x, not to RAM.
  MENDELEA_DB_MEMORY_LIMIT = "192MB"
  MENDELEA_DB_THREADS = "2"
  MENDELEA_DB_MAX_CONCURRENT = "4"

  # The detection threshold is a share of the corpus, so it depends on the
  # panel. The 2023 re-aggregation is 6,083 variants either way: 13.3% of the
  # five-gene panel the 5% default was chosen against, and 4.05% of this one.
  # Left at the default, this panel reports no policy event at all.
  MENDELEA_POLICY_THRESHOLD = "0.03"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero. The demo is shown in meetings, not hammered continuously,
  # and a cold start is a container with a 58 MB file in it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
